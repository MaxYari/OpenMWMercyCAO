#### Items listed here are never put on the ground when an actor surrenders.
# Mainly used for summoned (bound) items: if they get dropped, the spell can no longer remove them
# from the actor's inventory when it expires, and they stay in the world forever.
#
# To exclude your own items, add their record ids to the "recordIds" list of an "item_dump_disable"
# section - here or in your own .yaml file in this folder, all files are merged together.
# Record ids are case-insensitive.

item_dump_disable:
  recordIds:
    # Vanilla (Morrowind.esm)
    - bound_longsword
    - bound_mace
    - bound_battle_axe
    - bound_spear
    - bound_longbow
    - bound_cuirass
    - bound_helm
    - bound_boots
    - bound_shield
    - bound_dagger
    - bound_gauntlet_right
    - bound_gauntlet_left
    # Tamriel Data (used by Tamriel Rebuilt, Project Cyrodiil, Skyrim Home of the Nords).
